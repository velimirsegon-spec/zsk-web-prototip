<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" role="img" aria-label="Zagrebački sunčani krovovi">
  <title>Zagrebački sunčani krovovi d.o.o.</title>
  <!-- Mark: green rectangle on top, white gap (2/3 of rect height), yellow rectangle below.
       Each rectangle 60×30 (2:1). Gap = 20 (≈ 2/3 of 30). -->
  <g>
    <rect x="0" y="0"  width="60" height="30" fill="#4FA340"/>
    <rect x="0" y="50" width="60" height="30" fill="#F2C200"/>
  </g>
  <!-- Wordmark, vertically centered along the mark -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
     fill="#1a1a1a" font-weight="700" letter-spacing="1.2">
    <text x="76" y="22" font-size="14">ZAGREBAČKI</text>
    <text x="76" y="46" font-size="14">SUNČANI</text>
    <text x="76" y="70" font-size="14">KROVOVI</text>
  </g>
</svg>
